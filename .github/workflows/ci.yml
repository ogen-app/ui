name: CI

# Runs on every PR into develop or main, and on develop itself so a bad merge
# is caught even when nothing opens a PR against it.
on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

# A new push to the same branch cancels the run still going for the old one.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: typecheck · lint · format · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      # No `version:` — the action reads `packageManager` from package.json, so
      # CI and every developer machine run the same pnpm.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Each check runs even if an earlier one failed: one push should report
      # everything that is wrong, not just the first thing.
      - name: Typecheck
        if: '!cancelled()'
        run: pnpm typecheck

      - name: Lint
        if: '!cancelled()'
        run: pnpm lint

      - name: Format
        if: '!cancelled()'
        run: pnpm format:check

      - name: Test
        if: '!cancelled()'
        run: pnpm test

      - name: Build
        if: '!cancelled()'
        run: pnpm build

      # `src/routeTree.gen.ts` is generated by the router plugin during the
      # build above. If the build rewrote it, the committed copy was stale —
      # which means routing in CI differs from routing on the branch.
      - name: Generated route tree is up to date
        if: '!cancelled()'
        run: git diff --exit-code -- src/routeTree.gen.ts
