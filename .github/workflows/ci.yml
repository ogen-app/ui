name: CI

# Runs on every PR into develop or main, and on develop itself so a bad merge
# is caught even when nothing opens a PR against it.
on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

# A new push to the same PR cancels the run still going for the old one.
# A branch push gets a group of its own (its SHA), so it is neither cancelled
# nor left pending where a newer push could replace it — a shared group holds
# one pending run, and queue: max can't sit beside cancel-in-progress: true.
# Every green develop merge publishes; the publish job queues them in order.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: typecheck · lint · format · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      # No `version:` — the action reads `packageManager` from package.json, so
      # CI and every developer machine run the same pnpm.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Each check runs even if an earlier one failed: one push should report
      # everything that is wrong, not just the first thing.
      - name: Typecheck
        if: '!cancelled()'
        run: pnpm typecheck

      - name: Lint
        if: '!cancelled()'
        run: pnpm lint

      - name: Format
        if: '!cancelled()'
        run: pnpm format:check

      - name: Test
        if: '!cancelled()'
        run: pnpm test

      - name: Build
        if: '!cancelled()'
        run: pnpm build

      # `src/routeTree.gen.ts` is generated by the router plugin during the
      # build above. If the build rewrote it, the committed copy was stale —
      # which means routing in CI differs from routing on the branch.
      - name: Generated route tree is up to date
        if: '!cancelled()'
        run: git diff --exit-code -- src/routeTree.gen.ts

  # Every green develop push publishes ghcr.io/ogen-app/ui:<build>, where build
  # is the commit count on develop, then asks ogen-release to bump the ui to it.
  publish:
    name: Build and push Docker image
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Back-to-back merges publish one at a time, so build numbers reach the
    # registry and ogen-release in order. queue: max keeps every waiting run;
    # by default a newer one would cancel the run already waiting.
    concurrency:
      group: publish
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read
      packages: write

    steps:
      # Full history: the build number is the commit count, which a shallow
      # clone reports as 1.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Build number
        id: build
        run: echo "number=$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # The source label links the package to this repo, which is what lets
      # GITHUB_TOKEN push to it.
      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ghcr.io/ogen-app/ui:${{ steps.build.outputs.number }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/ogen-app/ui
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Best effort: a missing ogen-release repo or token must not fail develop.
      - name: Dispatch bump to ogen-release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.RELEASE_DISPATCH_TOKEN }}
          BUILD: ${{ steps.build.outputs.number }}
        run: |
          gh api repos/ogen-app/ogen-release/dispatches \
            -f event_type=bump \
            -f 'client_payload[service]=ui' \
            -F "client_payload[build]=$BUILD" \
            -f "client_payload[revision]=$GITHUB_SHA"
