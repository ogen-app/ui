# CodeRabbit review configuration. Overrides the dashboard defaults and is
# itself reviewed in PRs. Docs: https://docs.coderabbit.ai/reference/yaml-template
language: en
reviews:
  profile: chill            # or "assertive" for nittier reviews
  request_changes_workflow: false
  high_level_summary: true
  auto_review:
    enabled: true
    base_branches:
      - main
  path_filters:
    - "!dist/**"
    - "!pnpm-lock.yaml"
    # The free plan skips any review past 100 files, and release PRs
    # (develop -> main) accumulate whole cycles — the first one to hit the cap
    # was 107 files. Docs, tests, env examples and this file are dropped from
    # review scope to keep the source files reviewable.
    - "!**/*.md"
    - "!**/*.test.ts"
    - "!**/*.test.tsx"
    - "!.env.example"
    - "!.coderabbit.yaml"
    # Same cap-management, continued: the generated route tree and the i18n
    # string catalogues are bulk without review value.
    - "!src/routeTree.gen.ts"
    - "!src/i18n/resources/**"
chat:
  auto_reply: true
