# CodeRabbit review configuration. Overrides the dashboard defaults and is
# itself reviewed in PRs. Docs: https://docs.coderabbit.ai/reference/yaml-template
language: en
reviews:
  profile: chill # or "assertive" for nittier reviews
  request_changes_workflow: false
  high_level_summary: true
  auto_review:
    # Reviews are opt-in everywhere: add the `coderabbit` label (or comment
    # `@coderabbitai review`) on the PRs worth machine eyes — substantial
    # feature PRs into develop, before they merge. Small chores skip it.
    #
    # Release PRs (develop -> main) used to be the automatic case, but they
    # outgrew the free plan's 100-file cap: the review either skipped itself
    # or forced the release into "part N" slices just to stay reviewable.
    # Reviewing at feature granularity fits the cap and lands the feedback
    # before the code is on develop, which is when it can still change
    # anything. So this file is now identical on develop and main — the
    # base-branch copy wins on this public repo, and opt-in is the rule on
    # both.
    enabled: false
    labels:
      - coderabbit
    drafts: false
  path_filters:
    - '!dist/**'
    - '!pnpm-lock.yaml'
    # Bulk without review value, kept out of the cap's budget: the generated
    # route tree and the i18n string catalogues. The wider release-era
    # exclusions (docs, tests, .env.example) are gone on purpose — a feature
    # PR's tests and docs are exactly what a review should read.
    - '!src/routeTree.gen.ts'
    - '!src/i18n/resources/**'
chat:
  auto_reply: true
